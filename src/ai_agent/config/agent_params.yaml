agent_node:
  ros__parameters:
    # LLM provider — "llamacpp" uses the same ChatOpenAI class with a custom base_url
    # Options: llamacpp | openai | anthropic | gemini | ollama
    provider: "openai"

    # Model name — llama.cpp server ignores this field, so any string works
    model: "gpt-4o-mini"

    # Environment variable that holds the API key (leave empty for llama.cpp)
    api_key_env: "OPENAI_API_KEY"

    # Mac Mini llama.cpp server endpoint — update with your Mac Mini's IP
    base_url: ""

    # Max tokens per LLM response
    max_tokens: 3000

    # Number of user/assistant turn pairs to keep in conversation memory
    history_turns: 6

    # Subscribe to /camera/color/image_raw (Logitech cam on Jetson) and cache the
    # latest frame so local_agent's look() can see and reason over it.
    use_vision: true

    # Seconds to wait for Jetson's Moondream to answer a /vision/query
    vision_query_timeout: 60.0

    # Force the supervisor's mandatory handover() via tool_choice. On llama.cpp the
    # server grammar-constrains the output (from the tool's JSON schema, incl. the
    # next_agent enum) so a small model can only emit a valid handover — no stray text,
    # no invalid agent. Requires a llama.cpp server started with --jinja (tool support).
    # OpenAI honors the same field. Set false only if your build lacks --jinja.
    strict_tool_calls: true

    # Stream sentence chunks to /voice/robot_speech as the LLM generates, ending
    # each utterance with the <|eou|> marker (see graph/utils/speech_stream.py).
    # First audio starts after the first sentence instead of the full reply.
    # Requires a llama.cpp build that streams tool calls (--jinja); set false to
    # publish one full reply per turn (wire protocol stays chunks + marker).
    stream_speech: true

    # ── local_agent (multimodal vision agent, Gemma via llama.cpp) ────────────
    # Dedicated llama.cpp KV-cache slot so its cached image prefix is never
    # evicted by other agents' calls. Requires the server started with
    # --parallel N (N > slot index). -1 = no pinning / auto slot.
    local_agent_slot: -1
    # Override model for local_agent only ("" = inherit the global model above).
    # Set this to your multimodal GGUF (e.g. "gemma-3n-e4b") if the global model
    # is text-only.
    local_agent_model: ""

    system_prompt: >
      You are a helpful home assistant robot. You can see through a camera,
      move autonomously, and speak to the user.
      Keep responses short and natural — you are talking to a person.
      Use speak() to acknowledge the user before starting long tool chains.
      Use query_vision() for focused visual questions (colour, shape, specific detail).
      Use navigate_to_pose() for map-based navigation — go to named rooms or locations.
      Use move_robot() only for short, precise fine movements (align, nudge, scan).
      Use ros2_publish() for hardware not covered by the other tools (arm, gripper, etc).

    # ── Provider overrides (uncomment to switch) ─────────────────────────────

    # OpenAI cloud:
    #   provider: "openai"
    #   model: "gpt-4o-mini"
    #   api_key_env: "OPENAI_API_KEY"
    #   base_url: ""

    # Anthropic Claude:
    #   provider: "anthropic"
    #   model: "claude-haiku-4-5-20251001"
    #   api_key_env: "ANTHROPIC_API_KEY"

    # Google Gemini:
    #   provider: "gemini"
    #   model: "gemini-2.0-flash"
    #   api_key_env: "GEMINI_API_KEY"

    # Ollama local:
    #   provider: "ollama"
    #   model: "llama3.2"
    #   base_url: "http://localhost:11434"
    #   api_key_env: ""
