pi5_tts_node:
  ros__parameters:
    model_path: /home/rakhi24/ros2_ws/src/langrobo_ros/models/kokoro/kokoro-v1.0.onnx
    voices_path: /home/rakhi24/ros2_ws/src/langrobo_ros/models/kokoro/voices-v1.0.bin
    voice: af_heart
    speed: 1.0
    output_device: Blackwire
    # ── Bluetooth speaker (Boat Stone etc.) ───────────────────────────────
    # Pair once:  ./scripts/bt_speaker.sh scan   then   ./scripts/bt_speaker.sh pair <MAC>
    # Then put the MAC here; both nodes connect it at startup and route audio
    # through PipeWire. Empty = wired audio only.
    bt_mac: "D6:AA:BB:59:EF:B6"        # boAt Stone 650
    # a2dp = speaker only, full quality (recommended — the wired mic stays).
    # hfp  = the speaker's call mic too, 8-16kHz mono: worse recognition AND
    #        worse playback. Needs pulseaudio-utils for the profile switch.
    bt_profile: hfp   # Stone mic in use; a2dp would kill it
    threads: 4
    # local | sarvam | soniox — see PI5_VOICE.md. Local Kokoro measured RTF ~1.8
    # (slower than real time); both cloud options publish sub-second/streaming
    # latency instead — this switch is about speed, not translation (that's the
    # STT side's reason). Same key/degrade rules as pi5_stt_node below.
    # local | sarvam | sarvam_translate | soniox. 'sarvam_translate' takes
    # English reply text and SPEAKS it in Telugu (translate -> TTS); see below.
    # Default = sarvam_translate so the brain's English replies are heard in Telugu.
    tts_provider: sarvam_translate
    tts_language: en
    tts_sarvam_voice: ritu     # bulbul:v3 speaker (used by sarvam + sarvam_translate)
    tts_soniox_voice: Adrian
    # Only used by tts_provider=sarvam_translate: source text language -> spoken language.
    tts_translate_from: en
    tts_translate_to: te

pi5_stt_node:
  ros__parameters:
    input_device: Blackwire
    bt_mac: "D6:AA:BB:59:EF:B6"        # boAt Stone 650
    bt_profile: hfp   # Stone mic in use; a2dp would kill it
    # Mic stays muted this long after TTS stops. 0.5 suits the USB headset;
    # A2DP buffers 100-250ms on top, so raise to ~1.2 with a Bluetooth speaker
    # or the robot transcribes the tail of its own reply.
    tts_tail_mute_s: 1.2   # raised for A2DP buffering (was 0.5, for the USB headset)
    model_size: base
    model_dir: /home/rakhi24/ros2_ws/src/langrobo_ros/models/whisper
    threads: 4
    vad_aggressiveness: 2
    # Acoustic wake word (openWakeWord). While asleep the node transcribes NOTHING
    # until it hears the wake word, then listens for follow_up_window_s. Set
    # wake_detector: transcript_alias to disable it and use the legacy name-in-text gate.
    wake_detector: openwakeword          # openwakeword | transcript_alias  (acoustic gate ON, hey_jarvis stand-in until hey_chotu.onnx)
    wake_word: hey_jarvis                # bundled stand-in until the custom rakhi.onnx is trained
    wake_model_path: ""                  # set to a custom .onnx (e.g. rakhi) to override wake_word
    # Measured live 2026-09-06 through the boAt Stone's HFP mic (8-16kHz
    # narrowband call audio, not what openWakeWord's pretrained models are
    # validated against): three clear "hey jarvis" utterances peaked at
    # 0.47/0.12/0.25 against an idle noise floor of 0.00-0.08 — real signal,
    # but the stock 0.5 threshold never crossed, so it silently never fired.
    # Lowered to sit below the measured peak and well above the noise floor.
    wake_threshold: 0.35
    follow_up_window_s: 9.0
    wake_aliases: ["rakhi", "chotu", "hey pi"]   # used only in transcript_alias mode with require_wake:true
    # require_wake:false -> forward every transcript to the brain (no name needed in the
    # text; the agent prompt knows it's "Rakhi" and judges relevance). Set true to gate on the aliases.
    # true = only transcripts containing a wake alias become turns. Essential
    # with a room mic: with it open, ambient noise the recogniser hallucinated
    # into sentences was answered as if spoken (observed 2026-09-05).
    require_wake: true
    stop_words: ["stop"]
    # Noise gate before the cloud call — see vad_gate.py. 0.05 clears the
    # measured Bluetooth-mic noise floor (~0.029) with margin; the old 0.012
    # shipped below that floor, so idle-room noise passed this check and only
    # voiced_ratio stood between it and a hallucinated cloud transcript.
    min_utterance_rms: 0.05
    min_voiced_ratio: 0.35
    # local | sarvam | soniox — see PI5_VOICE.md for the cost/latency comparison.
    # sarvam/soniox need SARVAM_API_KEY / SONIOX_API_KEY in ~/ros2_ws/.env (example.env
    # has placeholders); missing key or any request failure falls back to local
    # automatically (never goes silent — CLAUDE.md #4).
    # Default = sarvam: Telugu speech -> English text (household speaks Telugu).
    # ⚠️ COST/PRIVACY: with the wake word OFF (wake_detector: transcript_alias) this
    # sends EVERY ambient utterance to Sarvam. Re-enable the wake word to gate it,
    # or set stt_provider: local for free offline transcription.
    stt_provider: sarvam
    stt_source_language: te   # Telugu
    stt_target_language: en
