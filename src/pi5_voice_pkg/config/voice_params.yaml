# ── The one owner of the speaker + mic ────────────────────────────────────
# Nothing else touches Bluetooth or PipeWire defaults. It connects whichever
# paired/trusted Bluetooth audio device is switched on (bt_devices only says
# who to prefer when several are), uses its mic over HFP, applies the mic
# gain, reconnects on its own when the device drops, and tells the two voice
# nodes via /voice/audio_ready. Pair a new speaker/headphones ONCE with
# `./scripts/bt_speaker.sh pair <MAC>` and it is a candidate from then on.
pi5_audio_device:
  ros__parameters:
    bt_devices: ["D6:AA:BB:59:EF:B6"]   # boAt Stone 650 — preferred, not required
    # Use the Bluetooth device's own mic (HFP, 8-16kHz call audio). false =
    # A2DP playback only; the mic then comes from wired_fallback.
    # false since 2026-10-10 (owner): the Stone is the SPEAKER only, at full
    # A2DP quality, and the USB AM-C28 array is the mic (48 kHz, not 8 kHz).
    bt_prefer_mic: false
    # Software gain on the HFP mic, re-applied every time PipeWire re-creates
    # it. PER DEVICE — one number does not fit all mics:
    #   Stone (2026-09-11): at 1.0 speech arrived at rms ~0.024, under the 0.05
    #     min_utterance_rms gate, so NOTHING reached the brain; 4.0 clears it.
    #   OnePlus Buds (2026-09-20): the same 4.0 pinned the mic at full scale
    #     (idle rms 0.16, peak 1.00, VAD "speech" 100%) — every 20 s of room
    #     hiss went to Sarvam as an utterance. 1.0 is right for them.
    # Unlisted devices get bt_mic_gain.
    bt_mic_gain: 1.0
    bt_mic_gains: ["D6:AA:BB:59:EF:B6=4.0"]   # boAt Stone 650
    # Substring of the wired device: the mic while the Stone plays (A2DP), and
    # mic + speaker when no Bluetooth device is up. Was "Blackwire" (gone).
    wired_fallback: "AM-C28"
    # Its gain, set every time it is routed. Found at 400% (+36 dB) 2026-10-10:
    # an empty room clipped and every sound looked like speech.
    wired_mic_gain: 1.0
    poll_period_s: 3.0
    connect_retry_s: 10.0

pi5_tts_node:
  ros__parameters:
    model_path: /home/rakhi24/ros2_ws/src/langrobo_ros/models/kokoro/kokoro-v1.0.onnx
    voices_path: /home/rakhi24/ros2_ws/src/langrobo_ros/models/kokoro/voices-v1.0.bin
    voice: af_heart
    speed: 1.0
    # pipewire = whatever pi5_audio_device made the default speaker.
    output_device: pipewire
    threads: 4
    # local (Kokoro) | piper | sarvam | sarvam_translate | sarvam_stream | soniox.
    # DEFAULT (owner, 2026-10-04): the brain's English replies are SPOKEN in Telugu
    # through Sarvam. sarvam_stream = that, streamed: first sound ~0.8 s after a
    # sentence instead of ~1.8 s (translate on a kept-warm session + bulbul over one
    # WebSocket). Sarvam down -> tts_fallback speaks English. Fully local: piper
    # (RTF ~0.25); Kokoro (local) is more natural but RTF ~2 on this Pi.
    tts_provider: sarvam_stream
    tts_fallback: piper
    tts_piper_model: /home/rakhi24/ros2_ws/src/langrobo_ros/models/piper/en_US-lessac-medium.onnx
    tts_language: en
    tts_sarvam_voice: ritu     # bulbul:v3 speaker (used by sarvam + sarvam_translate)
    tts_soniox_voice: Adrian
    # Only used by tts_provider=sarvam_translate: source text language -> spoken language.
    tts_translate_from: en
    tts_translate_to: te
    # "Yes boss" the instant the wake word is heard, so you know it is
    # listening. Rendered once at startup through the provider above (no API
    # call per wake, same voice as its replies). Set cue_enabled: false for
    # silence; stt_node's wake_cue_delay_s decides WHEN it is appropriate.
    cue_enabled: true
    # Spoken exactly as written: cue_provider is a plain TTS (no translation
    # step), cue_language is the language of the text below. Leave both empty
    # to use tts_provider — but note sarvam_translate would TRANSLATE this,
    # and "chepandi boss" came back as చెపండి (misspelt) when we tried.
    cue_text: "చెప్పండి బాస్"           # Telugu: rendered by Sarvam at startup (needs it up then)
    # Spoken if a turn takes unusually long (cold cache, LLM unreachable) so
    # the robot never just goes quiet. Published by agent_node as cue "wait".
    cue_wait_text: "ఒక నిమిషం బాస్"
    cue_provider: sarvam
    cue_language: te

pi5_stt_node:
  ros__parameters:
    # pipewire = whatever pi5_audio_device made the default mic.
    input_device: pipewire
    # Mic stays muted this long after TTS stops. 0.5 suits the USB headset;
    # A2DP buffers 100-250ms on top, so raise to ~1.2 with a Bluetooth speaker
    # or the robot transcribes the tail of its own reply.
    tts_tail_mute_s: 1.2   # raised for A2DP buffering (was 0.5, for the USB headset)
    # tiny.en, beam 1, hotword "Kino" (the old name) (2026-10-03, bench on 8 kHz HFP-degraded speech):
    # name 20/20, about half base's time, and "stop" right where base heard "Star".
    # Its slip: "what do you see" -> "think". base: model_size: base.
    # With stt_provider sarvam this is only the fallback: English-only, so a failed
    # Sarvam call degrades to English transcription (owner: English is fine then).
    model_size: tiny.en
    stt_beam_size: 1
    stt_hotwords: "Kino, Hey Kino"
    model_dir: /home/rakhi24/ros2_ws/src/langrobo_ros/models/whisper
    threads: 2              # was 4: Whisper on room noise took ~3 of 4 cores and starved Kokoro (RTF 3-5)
    vad_aggressiveness: 2    # webrtc only
    # AM-C28 (2026-10-10, owner): the mic's audio goes to the recogniser UNTOUCHED --
    # no filter, no noise reduction. Silero only decides where a sentence starts and
    # ends; it never changes the audio.
    # silero: a neural voice detector -- 0% of the room counted as speech where
    # webrtc said 30-63%, so a sentence now ends ~0.6 s after you stop instead
    # of running to the cap (vad_silero.py). Model: models/README.md. Missing -> webrtc.
    vad_engine: silero
    # Audio kept from before the voice is detected, so a soft first word is not
    # cut. Replaying the owner's 39 recorded sentences into this node: 0.3 s ->
    # 14.3 % word errors ("Pay some music", "Palmi" for "Follow me"), 0.5 s -> 9.7 %,
    # 0.8 s -> 10.1 %. Timing only -- the audio itself is untouched.
    lead_in_s: 0.5
    vad_model_path: /home/rakhi24/ros2_ws/src/langrobo_ros/models/vad/silero_vad.onnx
    vad_threshold: 0.5
    vad_end_threshold: 0.35
    max_utterance_s: 12.0   # was the 20 s default: long TV stretches clogged the queue
    # Acoustic wake word (openWakeWord). While asleep the node transcribes NOTHING
    # until it hears the wake word, then listens for follow_up_window_s. Set
    # wake_detector: transcript_alias to disable it and use the legacy name-in-text gate.
    wake_detector: transcript_alias
    wake_word: kino
    wake_model_path: /home/rakhi24/ros2_ws/src/langrobo_ros/models/wake/kino.onnx
    wake_threshold: 0.45
    wake_verifier_path: ""                  # optional personal verifier: /home/rakhi24/ros2_ws/src/langrobo_ros/models/wake/kino_verifier.pkl
    follow_up_window_s: 9.0
    max_follow_ups: 2        # then the name again -- background talk chained forever without it
    wake_aliases: ["hey kino", "kino", "hi kino", "hello kino", "keeno", "hey keeno"]
    # none. Not [] -- an empty list leaves a ROS string-list parameter
    # uninitialised and stt_node would not start; "" entries are dropped.
    wake_leading_aliases: [""]
    # ON (owner, 2026-10-20): only a sentence with the name ("Kino, ...") is a
    # turn, then follow_up_window_s / max_follow_ups for the replies. It was OFF
    # from 2026-10-12 (every sentence went to the brain), and room talk like
    # "Okay." / "Yeah." became queued turns. false = answer everything.
    require_wake: true
    # 'name' = the name in the text + the follow-up window, nothing else.
    # 'llm' = a sentence without the name is put to the brain's LLM as a yes/no
    # (relevance.py, slot 4) -- it dropped real commands whenever the Mac was
    # busy ("Can you find the door?", 2026-10-12).
    addressing_mode: name
    # Every utterance -> one JSON line (heard, decision, near-miss like "keno"),
    # + WAV clips of wakes and near-misses. Read: scripts/wake_report.py. "" = off.
    wake_log_dir: /home/rakhi24/ros2_ws/logs/wake
    wake_log_clips: true
    heard_cue: true          # a chime when the llm filter accepts a sentence (addressing_mode: llm only)
    # Speak the acknowledgement only if you PAUSE after the name. Saying
    # "Kino, go to the kitchen" in one breath skips it rather than talking
    # over the command (see wake_cue.py).
    wake_cue: true
    wake_cue_delay_s: 0.4
    # Any of these ALONE (no name needed) halts speech AND the wheels (agent_node._on_tts_stop).
    stop_words: ["stop", "halt", "freeze", "quiet", "silence"]
    # Noise gate before the cloud call — see vad_gate.py. 0.05 clears the
    # measured Bluetooth-mic noise floor (~0.029) with margin; the old 0.012
    # shipped below that floor, so idle-room noise passed this check and only
    # voiced_ratio stood between it and a hallucinated cloud transcript.
    # 0 = off since 2026-10-10. 0.05 was tuned to the boAt Stone's 4x-gained
    # Bluetooth mic noise; on the AM-C28 (gain 1.0, its own level control) it is
    # the wrong yardstick and would drop quiet speech. Silero + the voiced
    # ratio below now decide what is speech. Back to ~0.05 if the Stone is the mic.
    min_utterance_rms: 0.0
    # 0 = off since 2026-10-10. It guarded against noise that tripped webrtcvad
    # once; with Silero only a real voice starts a sentence, and the 0.3 s lead-in
    # + 0.6 s tail made short commands ("ఆగు", 0.4 s) score 0.22-0.31 and get
    # DROPPED in the owner's live test. min duration (300 ms) still applies.
    min_voiced_ratio: 0.0
    # local | sherpa | sarvam | soniox | apple — docs/voice/PI5_VOICE.md compares them.
    # LIVE since 2026-10-10 (owner, commit 89f6ac0): sherpa = NVIDIA Parakeet on the
    # Pi 5 -- English only, offline, free, no audio leaves the house. With
    # require_wake: false every sentence is transcribed, so this is also the
    # private/cheap choice. sarvam = Telugu speech -> English text (cloud; needs
    # SARVAM_API_KEY), the most accurate on the owner's voice; apple = the Mac
    # Mini's recogniser (docs/voice/MAC_STT.md, English only). Any failure falls
    # back to stt_fallback, then Whisper -- never silent (CLAUDE.md #5).
    # Owner's own voice, 39 sentences, fan on (docs/voice/VOICE_LAB_2026-10.md):
    # Sarvam 6-11 % word errors 0.35 s | Parakeet 10-15 % 0.55 s | tiny.en 45-54 %.
    # apple since 2026-10-20 (owner): kino-stt on the Mac (started by e12b5), on-device,
    # frees the Pi 5 CPU; Mac off/slow -> stt_fallback (Parakeet) within 5 s. On the
    # AM-C28 it hears "Hey Kino" as "Play Kino" (the mic drops the H): addressing.py
    # drops that "Play". Parakeet heard the name 8/9 vs Apple 3/9 on this mic.
    stt_provider: apple
    stt_source_language: te   # Telugu -- used by the translating cloud providers only
    stt_target_language: en
    stt_fallback: sherpa
    stt_sherpa_model_dir: /home/rakhi24/ros2_ws/src/langrobo_ros/models/sherpa/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
