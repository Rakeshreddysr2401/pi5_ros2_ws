[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "langrobo-core"
version = "1.0.0"
description = "Pure-Python brain of the LangRobo home robot (LangGraph supervisor + agents + services)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # Pinned to the working stack (see repo requirements.txt for the rationale
    # behind the langchain-mcp-adapters pin).
    "langgraph==0.3.34",
    "langchain-core==0.3.86",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-ollama",
    "langchain-community",
    "langchain-mcp-adapters>=0.1.4,<0.2",
    "python-dotenv",
    "typing-extensions",
    # Services layer
    "httpx>=0.27",          # telegram channel (also a transitive dep of the LLM SDKs)
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["langrobo_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
