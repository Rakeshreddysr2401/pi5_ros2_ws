# LangRobo brain — ROS parameters (LLM + robot behaviour).
# Service settings (cloud fallback, Qdrant memory, health API, tracing) are
# NOT here — they live in .env, validated by langrobo_core.services.config.
# See OPERATIONS.md for the full reference of both.

agent_node:
  ros__parameters:
    # LLM provider — "llamacpp" uses the ChatOpenAI class with a custom base_url.
    # Options: llamacpp | openai | anthropic | gemini | ollama
    # The launch file overrides provider/base_url (prod default: llamacpp + Mac Mini).
    provider: "llamacpp"

    # Model name — the llama.cpp server ignores this field, so any string works.
    model: "default"

    # Environment variable that holds the API key (leave empty for llama.cpp).
    api_key_env: ""

    # Mac Mini llama.cpp server endpoint (launch arg base_url overrides).
    base_url: "http://singireddys-mac-mini.local:8080/v1"

    # Max tokens per LLM response.
    max_tokens: 3000

    # User/assistant turn pairs kept in conversation memory (x4 for tool/image
    # messages). Each trim resets the llama.cpp prompt cache (the kept suffix
    # re-prefills), so bigger = fewer resets; the reset cost is hidden by the
    # background cache warmer in agent_node anyway.
    history_turns: 12

    # Subscribe to the Jetson camera topic and cache the latest frame so
    # local_agent's look() can see and reason over it.
    use_vision: true

    # Force the supervisor's mandatory handover() via tool_choice. On llama.cpp
    # the server grammar-constrains the output (from the tool's JSON schema,
    # incl. the next_agent enum) so a small model can only emit a valid
    # handover. Requires a llama.cpp server started with --jinja.
    strict_tool_calls: true

    # Stream sentence chunks to /voice/robot_speech as the LLM generates,
    # ending each utterance with the <|eou|> marker (utils/speech_stream.py).
    # First audio starts after the first sentence instead of the full reply.
    stream_speech: true

    # ── llama.cpp KV-cache slots ──────────────────────────────────────────
    # NOT configured here. Each agent's slot is declared next to the agent in
    # langrobo_core/registry.py (AgentSpec.slot), because it is a property of
    # the agent and nothing else. It used to be five parameters plus a
    # fold-when-out-of-range algorithm in agent_node, which is a lot of moving
    # parts for "give each agent its own cache".
    #
    # What you DO need: start the llama.cpp server with --parallel 4, one slot
    # per agent (supervisor, chat, local_agent, navigate). agent_node probes
    # the server's real slot count at boot and warns — loudly — if it is lower,
    # because sharing a slot means each call evicts the other agent's prompt
    # prefix and pays it back as ~18-50s of re-prefill on the next turn.

    # Override model for local_agent only ("" = inherit the global model).
    # Set to your multimodal GGUF if the global model is text-only.
    local_agent_model: ""

    # ── Named map locations (phase-2 nav/SLAM slot) ───────────────────────
    # navigate_to_pose() targets. Update with real coordinates once a SLAM map
    # exists (drive to each spot, read /visual_slam/tracking/odometry).
    locations.kitchen:     [2.5,  1.0,   0.0]   # [x_m, y_m, yaw_deg]
    locations.living_room: [0.0,  3.0,  90.0]
    locations.bedroom:     [-2.0, 2.0, 180.0]
    locations.entrance:    [0.0,  0.0,   0.0]

    # ── Robot body (sim vs rover) ──────────────────────────────────────────
    # Which physical/simulated body this brain is driving cmd_vel to. The real
    # rover (ESP32 via micro-ROS) takes a plain Twist on /cmd_vel; the Gazebo
    # sim body (rover_sim, see CLAUDE.md "Simulation laptop") takes a
    # TwistStamped on /mecanum_drive_controller/cmd_vel instead. Switched by
    # scripts/fleet.sh {sim|rover} (env var → launch arg → this param) — see
    # OPERATIONS.md. Default "rover" so this NEVER changes the real robot's
    # behaviour unless sim mode is explicitly requested.
    robot_body: "rover"   # "rover" | "sim"
